{% extends "base.html" %}

{% block title %}{% if tag %}Edit{% else %}Add{% endif %} {{ kind|capitalize }} | Admin{% endblock %}

{% block content %}
<section class="page-header">
    <h1>{% if tag %}Edit{% else %}Add{% endif %} {{ kind|capitalize }}</h1>
</section>

<form method="post" class="info-card">
    <input type="hidden" name="kind" value="{{ tag.kind if tag else kind }}">

    <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" class="form-control" required
               value="{{ tag.name if tag else '' }}">
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" class="form-control">{% if tag and tag.description %}{{ tag.description }}{% endif %}</textarea>
    </div>

    <div class="action-row">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('admin_tags') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
