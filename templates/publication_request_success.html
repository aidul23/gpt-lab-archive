{% extends "base.html" %}

{% block title %}Request submitted{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Request submitted</h1>
    <p>
        Thanks. Your request for <strong>{{ paper_request.title }}</strong>
        (linked to {{ paper_request.member.name }}) is waiting for admin review.
    </p>
    <div class="action-row">
        <a href="{{ url_for('member_detail', member_id=paper_request.member_id) }}" class="btn btn-primary">Back to profile</a>
        <a href="{{ url_for('publication_request_new') }}" class="btn btn-secondary">Submit another</a>
    </div>
</section>
{% endblock %}
